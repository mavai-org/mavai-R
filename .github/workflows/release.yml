name: Release conformance cases

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Package case files with schema
        run: |
          cd inst/cases
          zip "../../cases-${{ steps.version.outputs.tag }}.zip" *.json
          cd ../../schema
          zip -g "../cases-${{ steps.version.outputs.tag }}.zip" cases.schema.json

      - name: Package interchange schemas with worked examples
        run: |
          cd schema
          zip "../interchange-${{ steps.version.outputs.tag }}.zip" mavai-explore-1.schema.json mavai-optimize-1.schema.json
          cd ../inst/interchange
          zip -g "../../interchange-${{ steps.version.outputs.tag }}.zip" *.yaml README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cases-${{ steps.version.outputs.tag }}.zip
            interchange-${{ steps.version.outputs.tag }}.zip
          generate_release_notes: true
