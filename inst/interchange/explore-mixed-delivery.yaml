# Worked example: some failures were judged, some never arrived.
#
# The mixed case, and the one a consumer must not flatten. Ten of the twenty
# samples failed: seven were delivered and did not satisfy the contract, three
# never produced a response to judge. A reader told only "0.50" learns that the
# service is unreliable; a reader told which ten learns that the quality signal
# rests on seventeen delivered trials, not twenty.
#
# Both kinds are stated explicitly here. `evaluated` is the default reading of
# an entry with no kind at all — the sibling pre-amendment examples rely on
# that — but an emitter that states one kind states both, so a consumer never
# has to decide whether absence means "evaluated" or "this emitter is old".
#
# Note what the counts still do: they sum to `failures`, delivery entries
# included. The amendment adds a distinction, not a second denominator, and a
# failed delivery is a failed trial exactly as it was before.
