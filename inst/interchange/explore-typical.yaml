# Worked example: a typical exploration artefact.
# One document per explored experiment configuration. Percentiles are STATED
# by the emitter under its minimum-sample gate: here 17 passing samples state
# p50 (floor 5) but not p95 (floor 20) nor p99 (floor 100) — absence means
# "not stateable", never zero.
schemaVersion: "mavai-explore-1"
serviceContractId: "shopping-basket"
experimentId: "model-comparison"
configuration: "small-model_t0.7"
# What the author was actually testing, in their words — stated on the grid
# entry, never derived from the factor values. A consumer showing this
# configuration to a reader shows this; with it absent (as in the sibling
# minimal example) the consumer falls back to something it derives from
# `configuration` above. Prose, so it is bounded and guarantees nothing:
# it never becomes identity, and two configurations may share a name.
configurationName: "cheap-and-loose"
# The sweep was built around this configuration; the others override its
# factor values. Stated by the emitter, which holds the authored fact — a
# consumer cannot recover it from a balanced sweep, where every
# configuration is structurally interchangeable. Stated only on the base,
# and only ever as true; the sibling minimal example omits it, which means
# unstated rather than "not the base".
baseConfiguration: true
generatedAt: "2026-07-14T12:00:00Z"
factors:
  model: "small-model"
  temperature: 0.7
execution:
  samplesPlanned: 20
  samplesExecuted: 20
  terminationReason: "COMPLETED"
# How each input presents itself, for a reader: a file input's document name,
# a text input's bounded excerpt. Stated for EVERY input the run drove, not
# only for those that failed — a consumer naming some rows and leaving others
# blank is the asymmetry this block removes. Never identity (that is the
# inputs fingerprint), and a consumer must render a document that omits it.
inputs:
  - inputIndex: 0
    inputExcerpt: "a litre of milk, two apples"
  - inputIndex: 1
    inputExcerpt: "delivery-note-1page.pdf"
statistics:
  observed: 0.85
  successes: 17
  failures: 3
  failureDistribution:
    - condition: "valid-json"
      count: 2
    - condition: "response-not-empty (input 1)"
      inputIndex: 1
      inputExcerpt: "the second worked example's driving text, briefly"
      count: 1
  criteria:
    response-not-empty:
      observedPassRate: 0.95
      pass: 19
      fail: 1
      failureDistribution:
        - condition: "response-not-empty (input 1)"
          inputIndex: 1
          inputExcerpt: "the second worked example's driving text, briefly"
          count: 1
      # Standings (amendment 2026-07-28): the descriptive per-(input, check)
      # tally of per-trial check outcomes — counts and the observed fraction
      # only, never an interval or a per-check verdict. Every row states
      # whether its check is optional; a criterion with no optional checks
      # states no optionalSlack.
      standings:
        rows:
          - inputIndex: 0
            check: "response is not empty"
            optional: false
            passed: 10
            failed: 0
            skipped: 0
            observedFraction: 1.0
          - inputIndex: 1
            check: "response is not empty"
            optional: false
            passed: 9
            failed: 1
            skipped: 0
            observedFraction: 0.9
    valid-json:
      observedPassRate: 0.9
      pass: 18
      fail: 2
      failureDistribution:
        - condition: "valid-json"
          count: 2
      # This criterion declares partial credit: the declared budget travels
      # verbatim ('1' is a count), and the relaxable check is marked
      # optional on each of its rows. A skipped check was not judged
      # because an earlier transform failed; it counts in the tally.
      standings:
        optionalSlack: "1"
        rows:
          - inputIndex: 0
            check: "parses as json"
            optional: false
            passed: 9
            failed: 1
            skipped: 0
            observedFraction: 0.9
          - inputIndex: 0
            check: "declares an actions array"
            optional: true
            # Structured-row amendment (2026-07-28): the check's stated
            # structure and obtained-value exemplars, failing first.
            path: "$.actions"
            form: "is"
            expected: "true"
            passed: 8
            failed: 1
            skipped: 1
            observedFraction: 0.8
            observed:
              - excerpt: "[]"
                count: 1
                held: false
              - excerpt: "[{\"context\": \"SHOP\", \"name\": \"add\"}]"
                count: 8
                held: true
            elided: 1
          - inputIndex: 1
            check: "parses as json"
            optional: false
            passed: 9
            failed: 1
            skipped: 0
            observedFraction: 0.9
          - inputIndex: 1
            check: "declares an actions array"
            optional: true
            passed: 9
            failed: 0
            skipped: 1
            observedFraction: 0.9
cost:
  totalTimeMs: 6540
  avgTimePerSampleMs: 327
  totalTokens: 2000
  avgTokensPerSample: 100
latency:
  basis: "passing-samples"
  contributingSamples: 17
  totalSamples: 20
  p50Ms: 16
  sortedPassingLatenciesMs: [11, 12, 12, 13, 13, 14, 14, 15, 16, 16, 17, 17, 18, 19, 20, 22, 25]
