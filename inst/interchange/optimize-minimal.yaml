# Worked example: the minimal valid optimize artefact — a single iteration
# with no passing samples and a failure distribution (required because
# failures > 0). Both samples produced a response that the criterion then
# judged, so the latency block is present: two durations, below every
# percentile floor, so no stated percentile. The convergence block still names the
# best iteration: with one iteration, it is the best there is.
schemaVersion: "mavai-optimize-1"
serviceContractId: "echo-service"
objective: "MAXIMIZE"
generatedAt: "2026-07-14T12:00:00Z"
iterations:
  - iteration: 0
    factors:
      temperature: 0.5
    score: 0.0
    execution:
      samplesExecuted: 2
      terminationReason: "COMPLETED"
    statistics:
      observed: 0.0
      successes: 0
      failures: 2
      failureDistribution:
        - condition: "echoes-input"
          count: 2
      criteria:
        echoes-input:
          observedPassRate: 0.0
          pass: 0
          fail: 2
          failureDistribution:
            - condition: "echoes-input"
              count: 2
    latency:
      basis: "responded-samples"
      contributingSamples: 2
      totalSamples: 2
      sortedPassingLatenciesMs: [140, 210]
convergence:
  totalIterations: 1
  bestIteration: 0
  bestScore: 0.0
  bestFactors:
    temperature: 0.5
