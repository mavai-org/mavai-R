# Worked example: a typical optimize artefact.
# One document per optimize run: the full iteration history plus the
# convergence summary, which must be internally consistent with the iteration
# it names (a semantic obligation on emitters, cross-checked by their
# conformance tests). Per-iteration sample counts are typically small, so most
# latency percentiles are absent — that is the emitter's gate working:
# iteration 1's five passing samples state p50 (floor 5); two and four
# passing samples state nothing.
schemaVersion: "mavai-optimize-1"
serviceContractId: "shopping-basket"
experimentId: "temperature-optimization"
objective: "MAXIMIZE"
generatedAt: "2026-07-14T12:00:00Z"
iterations:
  - iteration: 0
    factors:
      model: "small-model"
      temperature: 0.9
    score: 0.4
    execution:
      samplesExecuted: 5
      terminationReason: "COMPLETED"
    statistics:
      observed: 0.4
      successes: 2
      failures: 3
      failureDistribution:
        - condition: "valid-json"
          count: 3
      criteria:
        valid-json:
          observedPassRate: 0.4
          pass: 2
          fail: 3
          failureDistribution:
            - condition: "valid-json"
              count: 3
          # Standings (amendment 2026-07-28): identical shape to the
          # exploration schema's block, stated per iteration. Descriptive
          # only; the declared budget travels verbatim and every row
          # states its optional flag.
          standings:
            optionalSlack: "1"
            rows:
              - inputIndex: 0
                check: "parses as json"
                optional: false
                passed: 2
                failed: 3
                skipped: 0
                observedFraction: 0.4
              - inputIndex: 0
                check: "declares an actions array"
                optional: true
                passed: 2
                failed: 0
                skipped: 3
                observedFraction: 0.4
    cost:
      totalTimeMs: 2400
      avgTimePerSampleMs: 480
    latency:
      basis: "passing-samples"
      contributingSamples: 2
      totalSamples: 5
      sortedPassingLatenciesMs: [420, 510]
  - iteration: 1
    factors:
      model: "small-model"
      temperature: 0.3
    score: 1.0
    execution:
