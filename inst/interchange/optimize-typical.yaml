      observed: 1.0
      successes: 5
      failures: 0
      criteria:
        valid-json:
          observedPassRate: 1.0
          pass: 5
          fail: 0
          standings:
            optionalSlack: "1"
            rows:
              - inputIndex: 0
                check: "parses as json"
                optional: false
                passed: 5
                failed: 0
                skipped: 0
                observedFraction: 1.0
              - inputIndex: 0
                check: "declares an actions array"
                optional: true
                passed: 5
                failed: 0
                skipped: 0
                observedFraction: 1.0
    cost:
      totalTimeMs: 2270
      avgTimePerSampleMs: 454
    latency:
